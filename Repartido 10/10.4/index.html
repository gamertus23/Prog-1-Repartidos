<body>
    <p>4. Diseñar una página que permita ingresar 2 números y según la selección de un radio
button (+ - * /) realice la operación elegida.</p>

<label>Num: 1</label>
<input type="number" id="num1">
<label>Num: 2</label>
<input type="number" id="num2">


    <input type="radio" name="igual" value="+">SUMA(+)
    <input type="radio" name="igual" value="-">RESTA(-)
    <input type="radio" name="igual" value="*">MULTIPLICACION(*)
    <input type="radio" name="igual" value="/">DIVICION(/)



<input type="button" value="Calcular" id="calcular">

<input type="text" id="resultado" disabled>

</body>
